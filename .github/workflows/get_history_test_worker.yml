name: Get History Worker Tests

on:
  push:
    paths:
      - 'get_history_worker/**'
      - '.github/workflows/get_history_test_worker.yml'
  pull_request:
    paths:
      - 'get_history_worker/**'
      - '.github/workflows/get_history_test_worker.yml'
jobs:
  test-get-history-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: get_history_worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('get_history_worker/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: get_history_worker/coverage.xml

      - name: Enforce minimum coverage
        run: |
          coverage report --fail-under=80
name: Adapter Tests

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
    paths:
      - 'adapter/**'
      - '.github/workflows/adapter-tests.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
    paths:
      - 'adapter/**'
      - '.github/workflows/adapter-tests.yml'

jobs:
  test-adapter:
    name: Test and Scan Adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('adapter/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r adapter/requirements.txt

      - name: Run pytest
        run: pytest adapter/

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: adapter/
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: adapter/
          format: sarif
          output: trivy-adapter-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-adapter-results.sarif

name: Submission Worker Tests

permissions:
  contents: read
  security-events: write

on:
   push:
    paths:
      - 'submission_worker/**'
      - '.github/workflows/submission_worker_tests.yml'
   pull_request:
    paths:
      - 'submission_worker/**'
      - '.github/workflows/submission_worker_tests.yml'
jobs:
  test-submission-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: submission_worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=xml

      - name: Upload coverage to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: submission_worker/coverage.xml

      - name: Enforce minimum coverage
        run: |
          coverage report --fail-under=80

      - name: Build Docker image for scanning
        working-directory: submission_worker
        run: docker build -t submission-worker:${{ github.sha }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: submission-worker:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: submission-worker:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
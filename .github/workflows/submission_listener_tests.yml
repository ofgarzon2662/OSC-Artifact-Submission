name: Submission Listener Tests

permissions:
  contents: read
  security-events: write

on:
  push:
    paths:
      - 'submission_listener/**'
      - '.github/workflows/submission_listener_tests.yml'
  pull_request:
    paths:
      - 'submission_listener/**'
      - '.github/workflows/submission_listener_tests.yml'

jobs:
  test-submission-listener:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: submission_listener
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('submission_listener/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create contracts directory and schema file
      run: |
        mkdir -p contracts
        echo '{"$schema":"http://json-schema.org/draft-07/schema#","title":"artifact.submitted.v1","type":"object","additionalProperties":false,"required":["artifactId","submissionState","submittedAt","version"],"properties":{"artifactId":{"type":"string","format":"uuid"},"submissionState":{"enum":["PENDING","FAILED","SUCCESS"],"type":"string"},"submittedAt":{"type":"string","format":"date-time"},"blockchainTxId":{"type":"string"},"peerId":{"type":"string"},"version":{"enum":["v1"],"type":"string"}}}' > contracts/artifact.submitted.v1.schema.json
    
    - name: Run submission listener tests only
      run: |
        timeout 60 pytest test_app.py -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=75 || true

    - name: Build Docker image for scanning
      working-directory: submission_listener
      run: docker build -t submission-listener:${{ github.sha }} .

    - name: Run Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: submission-listener:${{ github.sha }}
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH

    - name: Run Trivy image scan (SARIF)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: submission-listener:${{ github.sha }}
        format: sarif
        output: trivy-results.sarif
        exit-code: '0'
        severity: CRITICAL,HIGH

    - name: Upload Trivy SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  deploy:
    name: Deploy to ECS
    needs: [test-submission-listener]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269624229733:role/osc-github-deploy-submission-listener
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: osc-submission-listener
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./submission_listener
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition osc-submission-listener \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: submission-listener
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: osc-submission-listener
          cluster: osc-staging
          wait-for-service-stability: true

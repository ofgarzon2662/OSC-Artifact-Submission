name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-submission-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-locks:
    name: Python lock policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest scripts/security/test_check_python_locks.py
      - run: >-
          python3 scripts/security/check_python_locks.py
          adapter submission_listener submission_worker get_history_worker mock-osc-api

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  python:
    name: Python tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: python-locks
    strategy:
      fail-fast: false
      matrix:
        component: [adapter, submission_listener, submission_worker, get_history_worker]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.lock
      - name: Install hash-locked binary dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock'
      - name: Verify declared requirements are represented in the lock
        run: python -m pip check
      - name: Tests and coverage
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.component }}-coverage
          path: ${{ matrix.component }}/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  bridge:
    name: Legacy bridge compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test supply-chain scanner
        run: python3 -m unittest fabric-bridge/scripts/security/test_check_npm_supply_chain.py
      - name: Scan repository and bridge lockfile before installation
        run: >-
          python3 fabric-bridge/scripts/security/check_npm_supply_chain.py
          --repo .
          --lock fabric-bridge/package-lock.json
          --blocklist fabric-bridge/security/npm-malware-blocklist.csv
          --policy fabric-bridge/security/npm-lifecycle-allowlist.json
          --skip-installed
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Prove dependency lifecycle scripts are suppressed
        working-directory: fabric-bridge
        run: python3 scripts/security/test_lifecycle_suppression.py
      - name: Install reviewed dependencies
        working-directory: fabric-bridge
        run: bash scripts/security/secure-install.sh --ci
      - working-directory: fabric-bridge
        run: npm test -- --coverage --runInBand
      - working-directory: fabric-bridge
        run: npm run build
      - working-directory: fabric-bridge
        run: npm audit --omit=dev --audit-level=critical
      - name: Generate CycloneDX SBOM
        working-directory: fabric-bridge
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-bridge-evidence
          path: |
            fabric-bridge/coverage/
            fabric-bridge/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4

  containers:
    name: Container (${{ matrix.component }})
    needs: [python, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [adapter, submission_listener, submission_worker, get_history_worker, fabric-bridge]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image
        run: docker build --tag osc-${{ matrix.component }}:${{ github.sha }} ./${{ matrix.component }}
      - name: Generate CycloneDX image SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: osc-${{ matrix.component }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: ${{ matrix.component }}-sbom.cdx.json
          artifact-name: ${{ matrix.component }}-sbom.cdx.json
      - name: Scan image
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: osc-${{ matrix.component }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

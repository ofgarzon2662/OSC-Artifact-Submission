name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-submission-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [adapter, submission_listener, submission_worker, get_history_worker]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - name: Tests and coverage
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.component }}-coverage
          path: ${{ matrix.component }}/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  bridge:
    name: Legacy bridge compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fabric-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fabric-bridge/package-lock.json
          package-manager-cache: true
      - run: npm ci
      - run: npm test -- --coverage --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4

  containers:
    name: Container (${{ matrix.component }})
    needs: [python, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [adapter, submission_listener, submission_worker, get_history_worker, fabric-bridge]
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --tag osc-${{ matrix.component }}:${{ github.sha }} ./${{ matrix.component }}
      - name: Scan image
        id: scan
        uses: anchore/scan-action@v7.4.0
        with:
          image: osc-${{ matrix.component }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}


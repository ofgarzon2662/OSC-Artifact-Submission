name: Fabric Bridge Tests

on:
  push:
    paths:
      - 'fabric-bridge/**'
      - '.github/workflows/fabric-bridge-tests.yml'
  pull_request:
    paths:
      - 'fabric-bridge/**'
      - '.github/workflows/fabric-bridge-tests.yml'

jobs:
  test-fabric-bridge:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fabric-bridge

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('fabric-bridge/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: |
        npm ci || npm i

    - name: Run unit tests with coverage (>=80%)
      run: |
        npm test -- --coverage
version: '3.8'

networks:
  # Connect to the existing API services network
  osc-api-services-network:
    external: true
    name: osc-api-services-network

services:
  # RabbitMQ Message Broker with custom configuration
  rabbitmq:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: osc-artifact-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"  # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osc-api-services-network
    restart: unless-stopped

  # Adapter (Python) — bridges submission worker to OSC-API
  adapter:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    container_name: osc-adapter
    environment:
      ADAPTER_API_URL: ${ADAPTER_API_URL}
      ADAPTER_API_TOKEN: ${ADAPTER_API_TOKEN}
      ADAPTER_REQUEST_TIMEOUT_SECONDS: ${ADAPTER_REQUEST_TIMEOUT_SECONDS:-30}
    ports:
      - "${ADAPTER_PORT:-5000}:5000"
    networks:
      - osc-api-services-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Submission Worker
  submission_worker:
    build:
      context: ./submission_worker
      dockerfile: Dockerfile
    container_name: osc-submission-worker
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE_SUBMIT: ${RABBITMQ_QUEUE_SUBMIT:-artifact.submit.queue}
      RABBITMQ_QUEUE_SUBMITTED: ${RABBITMQ_QUEUE_SUBMITTED:-artifact.submitted.queue}

      # Upstream service (adapter)
      FABRIC_BRIDGE_URL: ${FABRIC_BRIDGE_URL:-http://adapter:5000}

      # Environment
      ENVIRONMENT: docker
    ports:
      - "${SUBMISSION_WORKER_HEALTH_PORT:-8001}:8000"  # Health check port
    networks:
      - osc-api-services-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Submission Listener
  submission_listener:
    build:
      context: ./submission_listener
      dockerfile: Dockerfile
    container_name: osc-artifact-submission-listener
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE_SUBMITTED: ${RABBITMQ_QUEUE_SUBMITTED}
      RABBITMQ_QUEUE_UPDATED: ${RABBITMQ_QUEUE_UPDATED:-artifact.updated.queue}

      # API Gateway Configuration
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://osc-api-gateway:3000/api/v1/artifacts}
      API_GATEWAY_WORKFLOW_URL: ${API_GATEWAY_WORKFLOW_URL:-http://osc-api-gateway:3000/api/v1/workflows}
      SUBMISSION_LISTENER_API_KEY: ${SUBMISSION_LISTENER_API_KEY}
      SUBMISSION_LISTENER_SERVICE_ROLE: ${SUBMISSION_LISTENER_SERVICE_ROLE}

      # Environment
      ENVIRONMENT: docker
    ports:
      - "${HEALTH_CHECK_PORT:-8000}:8000"  # Health check port
    networks:
      - osc-api-services-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Get History Worker (FastAPI)
  get_history_worker:
    build:
      context: ./get_history_worker
      dockerfile: Dockerfile
    container_name: osc-get-history-worker
    environment:
      BRIDGE_URL: ${BRIDGE_URL:-http://adapter:5000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CACHE_MAX_ARTIFACTS: ${CACHE_MAX_ARTIFACTS:-100}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-500}
      GHW_BRIDGE_READ_TIMEOUT: ${GHW_BRIDGE_READ_TIMEOUT:-60}
      GHW_BRIDGE_CONNECT_TIMEOUT: ${GHW_BRIDGE_CONNECT_TIMEOUT:-10}
    ports:
      - "8002:8002"
    networks:
      - osc-api-services-network
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

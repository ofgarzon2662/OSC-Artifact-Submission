version: '3.8'

networks:
  # Connect to the existing API services network
  osc-api-services-network:
    external: true
    name: osc-api-services-network
  fabric-network:
    external: true
    name: fabric_test

services:
  # RabbitMQ Message Broker with custom configuration
  rabbitmq:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: osc-artifact-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"  # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osc-api-services-network
    restart: unless-stopped

  # Fabric Bridge (TypeScript)
  fabric-bridge:
    build:
      context: ./fabric-bridge
      dockerfile: Dockerfile
    container_name: fabric-bridge
    environment:
      - PORT=4000
      - FABRIC_PEER=${FABRIC_PEER:-localhost:7051}
      - WALLET_PATH=/wallets
      - MSP_ID=${MSP_ID:-Org1MSP}
      - IDENTITY_LABEL=${IDENTITY_LABEL:-svc-org1}
      - IDENTITY_FILE_PATH=/wallets/Org1MSP/svc-org1.id
      - TLS_CERT_PATH=/tls/peers-bundle.crt
      - UPDATE_ARGS_MODE=id+patch  
      - SUBMIT_FN=CreateArtifact
      - SUBMIT_ARGS_MODE=data-only 
      - PEER_ENDPOINT=peer0.org1.example.com:7051
      - FABRIC_CHANNEL=mychannel
      - FABRIC_CHAINCODE=oscis
      - DISCOVERY_ENABLED=true
      - DISCOVERY_AS_LOCALHOST=false
      - ENDORSING_ORGS=Org1MSP,Org2MSP

    ports:
      - "4000:4000"
    volumes:
    - ./fabric-bridge/wallets:/wallets:ro
    - ./fabric-bridge/peers-bundle.crt:/tls/peers-bundle.crt:ro
    networks:
      - osc-api-services-network
      - fabric-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Submission Worker
  submission_worker:
    build:
      context: ./submission_worker
      dockerfile: Dockerfile
    container_name: osc-submission-worker
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE_CREATED: ${RABBITMQ_QUEUE_CREATED}
      RABBITMQ_QUEUE_SUBMITTED: ${RABBITMQ_QUEUE_SUBMITTED}
      
      # Fabric Bridge Configuration
      FABRIC_BRIDGE_URL: ${FABRIC_BRIDGE_URL:-http://fabric-bridge:4000}
      
      # Environment
      ENVIRONMENT: docker
    ports:
      - "${SUBMISSION_WORKER_HEALTH_PORT:-8001}:8000"  # Health check port
    networks:
      - osc-api-services-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      fabric-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Submission Listener
  submission_listener:
    build:
      context: ./submission_listener
      dockerfile: Dockerfile
    container_name: osc-artifact-submission-listener
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE_SUBMITTED: ${RABBITMQ_QUEUE_SUBMITTED}
      
      # API Gateway Configuration
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      SUBMISSION_LISTENER_API_KEY: ${SUBMISSION_LISTENER_API_KEY}
      SUBMISSION_LISTENER_SERVICE_ROLE: ${SUBMISSION_LISTENER_SERVICE_ROLE}
      
      # Environment
      ENVIRONMENT: docker
    ports:
      - "${HEALTH_CHECK_PORT:-8000}:8000"  # Health check port
    networks:
      - osc-api-services-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped 
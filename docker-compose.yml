version: '3.8'

networks:
  # Connect to the existing API services network
  osc-api-services-network:
    external: true
    name: osc-api-services-network

services:
  # RabbitMQ Message Broker with custom configuration
  rabbitmq:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: osc-artifact-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"  # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osc-api-services-network
    restart: unless-stopped

  # Fabric Bridge (TypeScript)
  fabric-bridge:
    build:
      context: ./fabric-bridge
      dockerfile: Dockerfile
    container_name: fabric-bridge
    environment:
      - PORT=4000
      - FABRIC_PEER=${FABRIC_PEER:-peer0.org1.example.com:7051}
      - WALLET_SOURCE=${WALLET_SOURCE:-local}
      - WALLET_PATH=/wallets
      - MSP_ID=${MSP_ID:-Org1MSP}
      - IDENTITY_LABEL=${IDENTITY_LABEL:-svc-org1}
      - IDENTITY_FILE_PATH=/wallets/Org1MSP/svc-org1.id
      - TLS_CERT_PATH=/tls/peer0-org1-ca.crt
      - TLS_OVERRIDE_HOSTNAME=peer0.org1.example.com
      - UPDATE_ARGS_MODE=id+patch  
      - SUBMIT_FN=CreateArtifact
      - UPDATE_FN=UpdateArtifactDetails
      - SUBMIT_ARGS_MODE=data-only 
      - PEER_ENDPOINT=peer0.org1.example.com:7051
      - FABRIC_CHANNEL=mychannel
      - FABRIC_CHAINCODE=oscis
      - ENDORSING_ORGS=Org1MSP,Org2MSP
      - EVALUATE_DEADLINE_MS=60000
      - ENDORSE_DEADLINE_MS=30000
      - SUBMIT_DEADLINE_MS=10000
      - COMMIT_STATUS_DEADLINE_MS=60000
      - GRPC_MAX_RECV_BYTES=${GRPC_MAX_RECV_BYTES:-67108864}
      - GRPC_MAX_SEND_BYTES=${GRPC_MAX_SEND_BYTES:-16777216}

    ports:
      - "4000:4000"
    volumes:
    - ../OSC-Network/wallets:/wallets:ro
    - ../OSC-Network/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt:/tls/peer0-org1-ca.crt:ro
    networks:
      - osc-api-services-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Adapter (Python)
  adapter:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    container_name: osc-adapter
    environment:
      ADAPTER_API_URL: ${ADAPTER_API_URL}
      ADAPTER_API_TOKEN: ${ADAPTER_API_TOKEN}
      ADAPTER_REQUEST_TIMEOUT_SECONDS: ${ADAPTER_REQUEST_TIMEOUT_SECONDS:-30}
<<<<<<< HEAD
